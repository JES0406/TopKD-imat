[project]
name = "topkd-imat"
version = "0.1.0"
description = "TopKD (topological knowledge distillation) adapted to CIFAR-10 with exact persistence images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy",
    "scipy>=1.17.1",
    "tensorboard>=2.21.0",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topkd_imat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: slow end-to-end tests; excluded by default, run with `make test-e2e`"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
